name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Secret scan (no committed credentials — BUGLOG #41)
        run: |
          node --import tsx --test scripts/secret_scan.test.mts
          node --import tsx scripts/secret_scan.mts
      - name: Typecheck (shared / engine / api)
        run: npx tsc -b packages/shared apps/engine apps/api
      - name: Build web (includes type checking)
        run: npm -w @invest254/web run build
      - name: Test
        run: npm test

  # Gate: the migrations/ directory must exactly match the applied-ledger (schema_migrations, 0091).
  # Fails on any UNRECORDED (file added but not applied+recorded) or CHANGED (file edited after apply).
  # Skips gracefully when DATABASE_URL is absent (e.g. the mirrored template CI has no DB secret).
  migrations-ledger:
    name: migrations-ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Reconcile migrations against the ledger
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "No DATABASE_URL secret (non-prod mirror) — skipping migration-ledger gate."; exit 0
          fi
          node --import tsx scripts/migrations_status.mts

  # Gate: provable-fairness reproducibility must hold (>= 98% of the clean recent sample reproduces).
  # Dry-run (no audit-row write; the nightly reproducibility.yml persists rows). Skips without DATABASE_URL.
  reproducibility:
    name: reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Provable-fairness reproducibility gate (dry-run)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "No DATABASE_URL secret (non-prod mirror) — skipping reproducibility gate."; exit 0
          fi
          node --import tsx scripts/reproducibility_check.mts --days 2 --limit 500 --dry-run

  # docs/42 role-matrix UI e2e: the PRODUCTION web build in headless Chromium, as every operator tier
  # (incl. impersonation in a second tab), with the API mocked at the network layer. Fails if a screen
  # shows a tier a control the API refuses, hides one it allows, or drops the impersonation mode.
  web-roles-e2e:
    name: web roles e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build web against the mocked API origin
        env:
          NEXT_PUBLIC_API_BASE_URL: http://api.e2e.test/api/v1
        run: npm -w @invest254/web run build
      - name: Install a headless browser (not saved to the lockfile)
        run: |
          npm i --no-save playwright-core@1.56.1
          npx playwright-core install --with-deps chromium
      - name: Run the role matrix
        run: |
          (cd apps/web && npx next start -p 3100 > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3100/console && break; sleep 1; done
          WEB_URL=http://127.0.0.1:3100 node apps/web/e2e/roles.e2e.mjs
