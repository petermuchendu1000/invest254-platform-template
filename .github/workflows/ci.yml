name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# One run per ref: a new push to a PR cancels the run it supersedes, because nobody reads the result
# of a commit that is already history. NOT on main — there each commit's result is the record of
# whether THAT commit was green, and deploy.yml's gate reads it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Secret scan (no committed credentials — BUGLOG #41)
        run: |
          node --import tsx --test scripts/secret_scan.test.mts
          node --import tsx scripts/secret_scan.mts
      - name: Typecheck (shared / engine / api)
        run: npx tsc -b packages/shared apps/engine apps/api
      - name: Build web (includes type checking)
        run: npm -w @invest254/web run build
      - name: Test
        run: npm test

  # Gate: the migrations/ directory must exactly match the applied-ledger (schema_migrations, 0091).
  # Fails on any UNRECORDED (file added but not applied+recorded) or CHANGED (file edited after apply).
  # Skips gracefully when DATABASE_URL is absent (e.g. the mirrored template CI has no DB secret).
  # Gate: no public function is reachable with the Supabase ANON key (BUGLOG #143, migrations 0153/0204).
  #
  # Postgres grants EXECUTE to PUBLIC on every newly created function, so a migration that adds a
  # SECURITY DEFINER function and forgets to revoke it silently re-opens the hole 0153 closed. That
  # is exactly what happened twice (0172 and 0176) and went unnoticed BECAUSE THIS CHECK ALREADY
  # EXISTED BUT WAS NEVER RUN: it lives in packages/db/_testkit, needs a database, and nothing in CI
  # ever called it. Wiring it in is the half of #143 that stops the next one.
  #
  # Runs against a THROWAWAY Postgres built from the shim + every migration, so it needs no secret
  # and gates forks and PRs too. pgvector is in the image because migration 0057 creates that
  # extension and the stock postgres image cannot apply the chain without it.
  function-grants:
    name: function-grants (anon surface)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install psycopg2
        run: pip install --quiet psycopg2-binary
      - name: Every public function is closed to anon / authenticated
        env:
          PGCLIENTENCODING: UTF8
          PGHOST: 127.0.0.1
          PGPORT: '5433'
          PGPASSWORD: postgres
        run: python3 packages/db/_testkit/e2e_function_grants.py

  # NOTE: `migrations-ledger` MOVED to .github/workflows/deploy.yml, where it runs after `migrate`
  # (BUGLOG #144). It is not gone and it is not weakened — it is asked at the only moment it can be
  # answered. Here it raced the deploy that records the rows and reported every new migration as
  # UNRECORDED, so `main` went red on every migration merge until somebody re-ran it. Do not add it
  # back to this workflow; CI has no step that records a migration, so the race would return.

  # Gate: provable-fairness reproducibility must hold (>= 98% of the clean recent sample reproduces).
  # Dry-run (no audit-row write; the nightly reproducibility.yml persists rows). Skips without DATABASE_URL.
  reproducibility:
    name: reproducibility
    # Inert in the mirror template, which can never hold DATABASE_URL: a job-level `if` allocates no
    # runner, while the step's own `exit 0` still bills a whole minute. "Not the mirror" rather than
    # "is production" is deliberate — see docs/15 §4.2 rule 3 and BUGLOG #156.
    if: github.repository != 'petermuchendu1000/invest254-platform-template'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Provable-fairness reproducibility gate (dry-run)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "No DATABASE_URL secret (non-prod mirror) — skipping reproducibility gate."; exit 0
          fi
          node --import tsx scripts/reproducibility_check.mts --days 2 --limit 500 --dry-run

  # docs/42 role-matrix UI e2e: the PRODUCTION web build in headless Chromium, as every operator tier
  # (incl. impersonation in a second tab), with the API mocked at the network layer. Fails if a screen
  # shows a tier a control the API refuses, hides one it allows, or drops the impersonation mode.
  web-roles-e2e:
    name: web roles e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build web against the mocked API origin
        env:
          NEXT_PUBLIC_API_BASE_URL: http://api.e2e.test/api/v1
        run: npm -w @invest254/web run build
      - name: Install a headless browser (not saved to the lockfile)
        run: |
          npm i --no-save playwright-core@1.56.1
          npx playwright-core install --with-deps chromium
      - name: Run the role matrix
        run: |
          (cd apps/web && npx next start -p 3100 > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3100/console && break; sleep 1; done
          WEB_URL=http://127.0.0.1:3100 node apps/web/e2e/roles.e2e.mjs
          # DEMO-3: the account switcher on a phone viewport (taps, 44px targets, no demo withdrawal).
          # Reuses the same build + browser, so it costs seconds.
          SHOTS=0 WEB_URL=http://127.0.0.1:3100 node apps/web/e2e/accountswitcher.e2e.mjs
          SHOTS=0 PROBE_PATH=/ WEB_URL=http://127.0.0.1:3100 node apps/web/e2e/accountswitcher.e2e.mjs
          # …and the mode-locked wallet, which must refuse Real WITH a reason rather than look broken.
          SHOTS=0 MODE_LOCKED=1 WEB_URL=http://127.0.0.1:3100 node apps/web/e2e/accountswitcher.e2e.mjs
