name: Ticket Auto-Escalation

# Escalates overdue level-0 tickets to the System admin once their urgency SLA is breached
# (fn_ticket_auto_escalate, migration 0139). Runs every 15 minutes. Requires repo secret
# DATABASE_URL (Supabase session-pooler URL, :5432). Trigger manually via "Run workflow".
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ticket-escalate
  cancel-in-progress: false

jobs:
  escalate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Auto-escalate overdue tickets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "No DATABASE_URL secret — skipping."; exit 0; fi
          node --import tsx scripts/ops_ticket_escalate.mts
