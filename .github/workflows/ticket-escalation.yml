name: Ticket Auto-Escalation

# Escalates overdue level-0 tickets to the System admin once their urgency SLA is breached
# (fn_ticket_auto_escalate, migration 0139). Requires repo secret DATABASE_URL (Supabase
# session-pooler URL, :5432).
#
# THE SCHEDULE IS OFF, AND NOTHING IS LOST BY IT (2026-10-22): escalation now runs inside the API
# process, on the same 15-minute cadence, beside the deposit reconcile sweeps
# (apps/api/src/server.ts, TICKET_ESCALATE_INTERVAL_MS). This workflow ran `*/15 * * * *` — 96
# runners a day, each cold-booting node and `npm ci`-ing a monorepo to run one `select`, each opening
# a production database connection from GitHub's network.
#
# It is kept, dispatch-only, as the manual lever: Actions -> Ticket Auto-Escalation -> Run workflow.
# That is worth having when the API is down, mid-rollback, or when you want to force a pass without
# waiting for the timer. Running it while the API is also running is harmless — fn_ticket_auto_escalate
# is one `update ... returning` over escalation_level = 0, so whichever caller gets there first takes
# the rows and the other finds nothing.
#
# Restoring the `schedule:` block would double up with the in-process timer. Harmless, but pointless:
# change the interval in the API instead.
on:
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ticket-escalate
  cancel-in-progress: false

jobs:
  escalate:
    # Inert in the mirror template, which can never hold DATABASE_URL: a job-level `if` allocates no
    # runner, while the step's own `exit 0` still bills a whole minute. "Not the mirror" rather than
    # "is production" is deliberate — see docs/15 §4.2 rule 3 and BUGLOG #156.
    if: github.repository != 'petermuchendu1000/invest254-platform-template'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Auto-escalate overdue tickets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "No DATABASE_URL secret — skipping."; exit 0; fi
          node --import tsx scripts/ops_ticket_escalate.mts
