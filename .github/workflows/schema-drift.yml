name: Schema drift

# DRIFT-1 (BUGLOG #57): does production's schema still equal what the migrations build?
# The migrations ledger (migrations-ledger job) only proves WHICH files ran; on 2026-09-23 an
# out-of-band script had silently replaced functions/policies/indexes in production while the ledger
# stayed green. This builds a reference database from the shim + every migration in a throwaway
# Postgres 17 + pgvector service and diffs it against production object by object
# (scripts/schema_drift.mts). A non-zero exit lists every drifted object.
#
# Runs nightly, after every Deploy (Fly) run that applied migrations, and on demand.
# Requires repo secret DATABASE_URL (read-only catalog queries only). Skips without it (mirror repo).
on:
  schedule:
    - cron: "40 1 * * *"   # 01:40 UTC daily (~04:40 EAT)
  workflow_run:
    workflows: ["Deploy (Fly)"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: schema-drift
  cancel-in-progress: true

jobs:
  schema-drift:
    name: schema drift (production vs migrations)
    # After a deploy, only check when it succeeded (a failed deploy may have stopped before migrate).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    services:
      reference:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: reference
          POSTGRES_DB: reference
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests for the drift detector
        run: node --import tsx --test scripts/schema_drift.test.mts
      - name: Compare production with a migrations-built reference
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REFERENCE_DATABASE_URL: postgres://postgres:reference@127.0.0.1:5432/reference
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "No DATABASE_URL secret (non-prod mirror) — skipping schema-drift check."; exit 0
          fi
          node --import tsx scripts/schema_drift.mts --build-reference
