name: Subscription Lifecycle

# Advances platform subscriptions through Trial -> Past Due -> Grace -> Suspended based on
# ops_config durations (fn_subscription_auto_advance, migrations 0136-0137). Runs daily. Requires
# repo secret DATABASE_URL (Supabase session-pooler URL, :5432). Trigger manually via "Run workflow".
on:
  schedule:
    - cron: "20 21 * * *"   # 21:20 UTC = 00:20 EAT (start of the EAT day)
  workflow_dispatch: {}

concurrency:
  group: subscription-lifecycle
  cancel-in-progress: false

jobs:
  advance:
    # Inert in the mirror template, which can never hold DATABASE_URL: a job-level `if` allocates no
    # runner, while the step's own `exit 0` still bills a whole minute. "Not the mirror" rather than
    # "is production" is deliberate — see docs/15 §4.2 rule 3 and BUGLOG #156.
    if: github.repository != 'petermuchendu1000/invest254-platform-template'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Advance subscription lifecycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "No DATABASE_URL secret — skipping."; exit 0; fi
          node --import tsx scripts/ops_subscription_advance.mts
