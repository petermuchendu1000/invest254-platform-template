name: Automatic Pool Distribution

# POOL-1 (docs/46): once a day, applies each platform's automatic pool distribution (pool_auto_settings,
# migration 0164). DYNAMIC (demand-based) is the default and works over each platform's CURRENT total unless a
# daily total is configured on /platform/pool, so it never budgets more than the operator set. Audited
# (source='auto') and each run's outcome is shown on /platform/pool. Requires repo secret DATABASE_URL.
# Trigger manually anytime via "Run workflow" (optionally as a dry run).
on:
  schedule:
    - cron: "15 21 * * *"   # 21:15 UTC daily = 00:15 EAT (Africa/Nairobi, UTC+3) — start of the new EAT day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (do not apply)"
        type: boolean
        default: false

concurrency:
  group: pool-distribute
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply each platform's automatic distribution
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Absolute anti-starvation floor (docs/25 §15.6, item A): every active brand is funded to at
          # least max(POOL_MIN_FLOOR_CENTS, targetRtp × robust expected turnover). Optional; the
          # per-site DB valve (migration 0119) is the always-on guarantee, this is the operator dial.
          POOL_MIN_FLOOR_CENTS: ${{ vars.POOL_MIN_FLOOR_CENTS }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "No DATABASE_URL secret — skipping (non-prod mirror)."; exit 0
          fi
          node --import tsx scripts/pool_distribute_daily.mts ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
